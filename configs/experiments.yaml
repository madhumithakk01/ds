# Step 3: what is trained.  `python -m gids train` runs every enabled experiment in this order,
# skipping the ones that are finished.  Change values here or with --set (e.g.
# --set train_defaults.xgboost.n_estimators=300); a changed experiment trains into a new folder.

dataset:                        # sampled tables shared by all experiments (data/dataset-<hash>/)
  max_rows_per_class: 1000000   # training rows per class (unique rows, random sample of the big classes)
  val_max_rows_per_class: 500000
  merge_cross_file: true        # rows that are identical in two files (same capture stored twice) count once
  seed: 0

features:
  sets:
    full: [frame_len, ip_flags, ip_ttl, ip_proto, tcp_srcport, tcp_dstport, tcp_flags, tcp_window_size_value,
           tcp_window_size_scalefactor, tcp_pdu_size, udp_srcport, udp_dstport, tcp_options_len,
           tcp_options_kinds, proto_layers, proto_gre, dir_out, dir_in, ctx_all_pkts_1s, ctx_src_pkts_1s,
           ctx_src_pkts_10s, ctx_src_bytes_1s, ctx_dst_pkts_1s, ctx_pair_pkts_1s, ctx_pair_iat,
           ctx_flow_pkts_10s, ctx_flow_iat, ctx_src_new_dports_10s]
    no_ttl: [frame_len, ip_flags, ip_proto, tcp_srcport, tcp_dstport, tcp_flags, tcp_window_size_value,
             tcp_window_size_scalefactor, tcp_pdu_size, udp_srcport, udp_dstport, tcp_options_len,
             tcp_options_kinds, proto_layers, proto_gre, dir_out, dir_in, ctx_all_pkts_1s, ctx_src_pkts_1s,
             ctx_src_pkts_10s, ctx_src_bytes_1s, ctx_dst_pkts_1s, ctx_pair_pkts_1s, ctx_pair_iat,
             ctx_flow_pkts_10s, ctx_flow_iat, ctx_src_new_dports_10s]
    # no TTL and no raw port numbers: ports become their range (well-known / registered / dynamic)
    # and the standard service they belong to, if any (see gids/train.py: SERVICES)
    portable: [frame_len, ip_flags, ip_proto, sport_class, dport_class, sport_service, dport_service, tcp_flags,
               tcp_window_size_value, tcp_window_size_scalefactor, tcp_pdu_size, tcp_options_len,
               tcp_options_kinds, proto_layers, proto_gre, dir_out, dir_in, ctx_all_pkts_1s, ctx_src_pkts_1s,
               ctx_src_pkts_10s, ctx_src_bytes_1s, ctx_dst_pkts_1s, ctx_pair_pkts_1s, ctx_pair_iat,
               ctx_flow_pkts_10s, ctx_flow_iat, ctx_src_new_dports_10s]
    # portable without the fields that also fingerprint the sender's operating system
    # (TCP window size and scale factor, TCP options): only rates, flows, sizes, flags and protocol
    strict: [frame_len, ip_flags, ip_proto, sport_class, dport_class, sport_service, dport_service, tcp_flags,
             tcp_pdu_size, proto_layers, proto_gre, dir_out, dir_in, ctx_all_pkts_1s, ctx_src_pkts_1s,
             ctx_src_pkts_10s, ctx_src_bytes_1s, ctx_dst_pkts_1s, ctx_pair_pkts_1s, ctx_pair_iat,
             ctx_flow_pkts_10s, ctx_flow_iat, ctx_src_new_dports_10s]
    # step 6 ablation: the two halves of `portable`
    header: [frame_len, ip_flags, ip_proto, sport_class, dport_class, sport_service, dport_service, tcp_flags,
             tcp_window_size_value, tcp_window_size_scalefactor, tcp_pdu_size, tcp_options_len,
             tcp_options_kinds, proto_layers, proto_gre, dir_out, dir_in]          # this packet only
    context: [dir_out, dir_in, ctx_all_pkts_1s, ctx_src_pkts_1s, ctx_src_pkts_10s, ctx_src_bytes_1s,
              ctx_dst_pkts_1s, ctx_pair_pkts_1s, ctx_pair_iat, ctx_flow_pkts_10s, ctx_flow_iat,
              ctx_src_new_dports_10s]                                             # earlier packets only

train_defaults:
  model: xgboost
  feature_set: full
  label_scheme: coarse          # coarse: six classes | fine: every raw label that is kept
  xgboost:
    n_estimators: 600
    learning_rate: 0.1
    max_depth: 10
    min_child_weight: 1
    subsample: 0.8
    colsample_bytree: 0.8
    max_bin: 256
    early_stopping_rounds: 40   # stop when validation loss has not improved for this many rounds
    checkpoint_every: 25        # rounds between checkpoints on Drive
    device: auto                # auto: GPU when the runtime has one, else CPU | cpu | cuda
    seed: 0
  lightgbm:
    n_estimators: 600
    learning_rate: 0.1
    num_leaves: 255
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    max_bin: 255
    early_stopping_rounds: 40
    checkpoint_every: 25
    seed: 0
  random_forest:
    n_estimators: 60
    max_depth: 25
    min_samples_leaf: 10
    max_features: sqrt
    max_samples: 0.1            # share of the training rows drawn for each tree
    batch: 10                   # trees between checkpoints
    seed: 0
  logreg:                       # step 6 baseline: inputs sign(x)*log(1+|x|), standardised
    C: 1.0
    max_iter: 300
  mlp:                          # step 6 baseline: the dataset authors' 128-128-64 ReLU network
    hidden: [128, 128, 64]
    learning_rate: 0.001
    batch_size: 1024
    alpha: 0.0001
    epochs: 30
    rows_per_epoch: 500000      # class-balanced rows drawn afresh for every epoch
    early_stopping_rounds: 4    # epochs without a better validation loss
    checkpoint_every: 1
    seed: 0

experiments:                    # run in this order
  xgb_full: {model: xgboost, feature_set: full}
  xgb_portable: {model: xgboost, feature_set: portable}
  xgb_no_ttl: {model: xgboost, feature_set: no_ttl}
  lgbm_full: {model: lightgbm, feature_set: full}
  lgbm_portable: {model: lightgbm, feature_set: portable}
  rf_portable: {model: random_forest, feature_set: portable}
  xgb_portable_fine: {model: xgboost, feature_set: portable, label_scheme: fine,
                      xgboost: {n_estimators: 300}}   # 17 classes: every round builds 17 trees
  xgb_strict: {model: xgboost, feature_set: strict}
  # the third Mirai run (episode 2 of every Mirai label) is left out of training and early stopping;
  # step 4 tests whether the model still recognises that run
  xgb_portable_mirai_holdout: {model: xgboost, feature_set: portable,
                               holdout: {label_regex: "^Mirai", episode: 2}}
  # step 6 (python -m gids paper): not run by `train`; seed and leave-one-device-type-out copies are added
  # by the paper command itself
  xgb_header: {model: xgboost, feature_set: header, enabled: false}
  xgb_context: {model: xgboost, feature_set: context, enabled: false}
  logreg_portable: {model: logreg, feature_set: portable, enabled: false}
  mlp_portable: {model: mlp, feature_set: portable, enabled: false}

evaluate:                       # step 4 (python -m gids evaluate)
  models: [xgb_portable, xgb_full, lgbm_portable, xgb_strict, xgb_portable_fine]   # scored on the test split
  main: xgb_portable            # detailed tables and explanations
  holdout_experiment: xgb_portable_mirai_holdout   # trained without the third Mirai run ...
  holdout_compare: xgb_portable                    # ... compared with the model that saw its first 60 %
  shap_rows_per_class: 2000     # test packets per class used for the TreeSHAP explanations

paper:                          # step 6 (python -m gids paper); every part is resumable and saved on Drive
  main: xgb_portable            # the model the paper reports; the others are compared with it
  compare: [xgb_full, xgb_no_ttl, xgb_strict, lgbm_portable, rf_portable]   # also scored with intervals
  seeds: [1, 2, 3, 4]           # extra training seeds; seed 0 is the step 3 model
  seed_models: [xgb_portable, xgb_full]
  ablation: [xgb_header, xgb_context]
  baselines: [logreg_portable, mlp_portable]
  lodo_model: xgb_portable      # copies of this experiment are trained without one device type each ...
  lodo_limit: 8                 # ... for the attacked device types with the most attack packets (0 = all)
  corrected_models: [xgb_portable, xgb_full]   # trained again on the corrected labels (E2)
  behaviour_models: [xgb_portable, xgb_no_ttl, xgb_full]   # E2b: their predictions per behaviour group
  bootstrap_rounds: 1000        # cluster bootstrap: clusters = device type x raw label x run, per raw label
  bootstrap_seed: 0
  efficiency_rows: 200000       # test rows used to time prediction
  reference:                    # E1: the published evaluation protocol, reproduced on the same packets
    max_rows_per_label: 250000  # CSV packets sampled per raw label (each row keeps the packets it stands for)
    ours_max_rows_per_class: 400000   # prepared unique rows sampled per class for our features
    fractions: [0.6, 0.2, 0.2]  # random split of the reference notebook: train, validation, test
    seed: 42                    # random_state of the reference notebook
    protocols: [P1, P2, P3, P4, P5, P6, P7, P8, P9]
    rf_protocols: [P1, P4]      # also trained as a random forest
    xgboost: {n_estimators: 300, early_stopping_rounds: 20, checkpoint_every: 25}
    # close to scikit-learn's defaults, as in the published random forest: full-depth trees, leaves of one row
    random_forest: {n_estimators: 50, max_depth: null, min_samples_leaf: 1, max_samples: 0.5, batch: 25}
